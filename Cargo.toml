[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
todo-core = { path = "crates/core" }
assistant = { path = "crates/assistant" }
speech = { path = "crates/speech" }

# the inference engine and its GGUF / Hugging Face cache helpers
biv = { git = "https://github.com/vincenthz/biv" }
biv-cli = { git = "https://github.com/vincenthz/biv" }

anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = "0.8"
gpui-kit-assets = "0.8"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
# unoptimized biv, candle and FFT code make inference unusably slow in debug builds
opt-level = 3

[profile.release]
lto = "thin"
