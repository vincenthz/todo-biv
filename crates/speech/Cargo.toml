[package]
name = "speech"
description = "Microphone capture and English Whisper speech recognition on candle"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
candle-core = "0.9"
candle-nn = "0.9"
cpal = "0.18"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

# Metal is Apple-only, and features cannot be enabled per target: request
# candle's Metal backend on macOS alone, so other platforms build for the CPU
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", features = ["metal"] }
candle-nn = { version = "0.9", features = ["metal"] }

[dev-dependencies]
hound = "3"

# Profiles only take effect at a workspace root: while this crate lives in the
# todo-biv workspace, the workspace's [profile.*] apply. Once it has its own
# repository, add `[profile.dev.package."*"] opt-level = 3` there, as unoptimized
# candle and FFT code make Whisper unusably slow in debug builds.
